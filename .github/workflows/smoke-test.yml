name: smoke-test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx python-pptx Pillow
      - run: python tests/smoke_test.py
      - run: python tools/package_skills.py
