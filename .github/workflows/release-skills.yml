# Every push to main rebuilds the .skill files and replaces the assets on the
# rolling "latest" release, so anyone who uploads skills by hand (Claude
# desktop / claude.ai without organization sync) always has one current link.
name: release-skills
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-skills
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx python-pptx Pillow
      - run: python tests/smoke_test.py
      - run: python tools/package_skills.py
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Upload each .skill in Claude: Settings > Capabilities > Skills."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
            gh release upload latest dist/*.skill --clobber
          else
            gh release create latest dist/*.skill --title "Latest skills" --notes "$notes" --target "$GITHUB_SHA"
          fi
